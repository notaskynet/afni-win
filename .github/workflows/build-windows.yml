name: build-windows

# Builds one upstream AFNI tag for Windows (MSYS2 UCRT64), checks it against
# the official Linux CMake build of the same tag and, with publish=true,
# publishes the GitHub release <tag>-win. watch-upstream-tags.yml starts it
# for new tags with publish=true. A publishing run that fails opens the issue
# "Build failed: <tag>", after which the watcher no longer starts that tag.

run-name: build ${{ inputs.tag || 'baseline tag' }}${{ inputs.publish && ' (publish)' || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream AFNI tag (empty = manifests/upstream-baseline.txt)
        required: false
        default: ''
      publish:
        description: Publish the GitHub release <tag>-win
        type: boolean
        default: false
      reference_run:
        description: >-
          Reuse the pipeline-linux results of this earlier run ID instead of
          running the Linux pipeline again (same tag; not with publish)
        required: false
        default: ''
      package_run:
        description: >-
          Reuse the Linux reference, Windows package and regression results of
          this earlier run ID and run only the Windows pipeline (needs
          reference_run; not with publish)
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - compat/**
      - cmake/**
      - patches/**
      - tools/**
      - tests/**
      - manifests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-windows.yml

permissions:
  contents: read

concurrency:
  group: build-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  AFNI_UPSTREAM: https://github.com/afni/afni.git
  BUSYBOX_URL: https://frippery.org/files/busybox/busybox-w64u-FRP-6075-g169694ebd.exe
  BUSYBOX_FALLBACK_URL: https://frippery.org/files/busybox/busybox64u.exe
  BUSYBOX_SHA256: 6e263d154d8548d1eb936f65d1d8312c80df31c45974e48d6335e4dcc0f4f34c

jobs:
  python-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint, type-check and unit-test the Python tools
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen ty check tools tests runtime
          uv run --frozen pytest -q tests

  linux-reference:
    if: ${{ !inputs.package_run }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Select the upstream tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$(cat manifests/upstream-baseline.txt)}" >> "$GITHUB_OUTPUT"

      - id: r
        name: Read the pinned R version
        run: echo "version=$(awk '$1 == "version" {print $2}' manifests/r-runtime.txt)" >> "$GITHUB_OUTPUT"

      # R of the same version as on Windows (manifests/r-runtime.txt), for
      # R_io.so (cmake/afni-rio.cmake, D39).
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r.outputs.version }}
          use-public-rspm: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libexpat1-dev libqhull-dev libjpeg-dev \
            libmotif-dev libxt-dev libxmu-dev libxpm-dev libxi-dev libjpeg-progs \
            freeglut3-dev libglu1-mesa-dev libglw1-mesa-dev libgsl-dev libglib2.0-dev

      - name: Fetch upstream
        run: git -c advice.detachedHead=false clone --depth 1 --branch "${{ steps.tag.outputs.tag }}" "$AFNI_UPSTREAM" upstream

      # Official upstream CMake build (.docker/cmake_build.dockerfile: COMP_GUI=ON),
      # with SUMA for 3dSkullStrip and the src/ptaylor programs; Python and tcsh
      # scripts are not built (out of scope here). NIfTI and GIFTI come from the
      # same in-tree sources as on Windows (docs/DECISIONS.md, D17, D4a). The
      # programs that only src/Makefile.INCLUDE builds are added with
      # cmake/afni-extra-programs.cmake and R_io.so with cmake/afni-rio.cmake,
      # as on Windows (D33, D39).
      - name: Build the required programs
        env:
          CC: gcc
          CXX: g++
        run: |
          mapfile -t extra < <(sed 's/#.*//' manifests/programs-extra.txt | awk 'NF {print $1}')
          cmake -S upstream -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCOMP_GUI=ON -DCOMP_SUMA=ON \
            -DCOMP_PYTHON=OFF -DCOMP_TCSH=OFF -DREMOVE_BUILD_PARITY_CHECKS=ON -DUSE_OMP=ON \
            -DFETCHCONTENT_SOURCE_DIR_NIFTI_CLIB="$PWD/upstream/src/nifti" \
            -DFETCHCONTENT_SOURCE_DIR_GIFTI_CLIB="$PWD/cmake/gifti" \
            -DCMAKE_PROJECT_AFNI_INCLUDE="$PWD/cmake/afni-linux-reference.cmake" \
            "-DAFNI_WIN_EXTRA_PROGRAMS=$(IFS=';'; echo "${extra[*]}")" \
            "-DAFNI_WIN_R_HOME=$(Rscript -e 'cat(R.home())')"
          mapfile -t targets < <(cat manifests/programs-required.txt manifests/programs-pipeline.txt \
            | sed 's/#.*//' | awk 'NF {print $1}')
          cmake --build build-linux --target "${targets[@]}" "${extra[@]}" R_io

      # tar keeps the executable bits that artifacts drop.
      - name: Archive the programs for the pipeline reference
        run: tar -C build-linux -cf linux-programs.tar targets_built

      - uses: astral-sh/setup-uv@v6

      - name: Generate data and run the regression scenario
        run: |
          uv run --frozen python -m tests.regression.scenario prepare \
            --bin-dir build-linux/targets_built --out-dir regression/data
          uv run --frozen python -m tests.regression.scenario run \
            --bin-dir build-linux/targets_built --data-dir regression/data --out-dir regression/linux

      - name: Record POSIX call sites of the tag
        run: |
          uv run --frozen python -m tools.posix_diff scan --tag "${{ steps.tag.outputs.tag }}" \
            --source-dir upstream/src --output posix-callsites.json

      - uses: actions/upload-artifact@v4
        with:
          name: regression-data
          path: regression/data

      - uses: actions/upload-artifact@v4
        with:
          name: regression-linux
          path: regression/linux

      - uses: actions/upload-artifact@v4
        with:
          name: posix-callsites
          path: posix-callsites.json

      - uses: actions/upload-artifact@v4
        with:
          name: linux-programs
          path: linux-programs.tar

  # Linux reference of the acceptance pipeline (tests/pipeline, D40): the
  # programs of linux-reference with the upstream scripts and afnipy of the
  # same tag in one directory, system tcsh and Python, and R with the CRAN
  # packages of the same snapshot as on Windows.
  pipeline-linux:
    needs: linux-reference
    if: ${{ !inputs.reference_run }}
    runs-on: ubuntu-24.04
    env:
      AFNI_TAG: ${{ needs.linux-reference.outputs.tag }}
      OMP_NUM_THREADS: '1'
      AFNI_RANDOM_SEEDVAL: '31416'
    steps:
      - uses: actions/checkout@v4

      - id: r
        name: Read the pinned R version
        run: echo "version=$(awk '$1 == "version" {print $2}' manifests/r-runtime.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r.outputs.version }}
          use-public-rspm: false

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libexpat1-dev libqhull-dev libjpeg-dev \
            libmotif-dev libxt-dev libxmu-dev libxpm-dev libxi-dev libjpeg-progs \
            freeglut3-dev libglu1-mesa-dev libglw1-mesa-dev libgsl-dev libglib2.0-dev \
            tcsh python-is-python3 python3-numpy python3-matplotlib netpbm

      - uses: astral-sh/setup-uv@v6

      - name: Install the R packages
        run: uv run --frozen python -m tools.r_runtime --linux-codename noble --download-dir r-linux

      - uses: actions/download-artifact@v4
        with:
          name: linux-programs

      - name: Assemble programs, scripts and afnipy
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch "$AFNI_TAG" "$AFNI_UPSTREAM" upstream
          tar -xf linux-programs.tar
          mkdir afni-bin
          cp -a targets_built/. afni-bin/
          find upstream/src/scripts_install upstream/src/python_scripts/scripts upstream/src/scripts_for_r \
            upstream/src/R_scripts -maxdepth 1 -type f ! -name CMakeLists.txt -exec cp -p {} afni-bin/ \;
          cp -r upstream/src/python_scripts/afnipy afni-bin/afnipy
          echo "LD_LIBRARY_PATH=$PWD/afni-bin" >> "$GITHUB_ENV"

      - name: Fetch the data
        run: uv run --frozen python -m tests.pipeline.data --data-dir pipeline/data

      - name: Run the subjects and the group analysis
        run: |
          args=(--platform linux --afni-dir "$PWD/afni-bin" --data-dir pipeline/data
            --work-dir pipeline/work --results-dir results)
          uv run --frozen python -m tests.pipeline.run prepare "${args[@]}"
          uv run --frozen python -m tests.pipeline.run check "${args[@]}"
          uv run --frozen python -m tests.pipeline.run subjects "${args[@]}"
          uv run --frozen python -m tests.pipeline.run group "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-linux
          path: |
            results
            r-linux/r-runtime.json

  windows:
    needs: linux-reference
    if: ${{ !inputs.package_run }}
    runs-on: windows-latest
    env:
      AFNI_TAG: ${{ needs.linux-reference.outputs.tag }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Second line: the scripting runtime shipped in the package
          # (manifests/scripting-runtime.txt, D38).
          install: >-
            git make zstd pacman-contrib
            tcsh bash coreutils sed grep gawk perl bc which procps-ng findutils diffutils tar gzip
          pacboy: >-
            gcc:p cmake:p ninja:p zlib:p expat:p qhull:p libjpeg-turbo:p gsl:p
            python:p python-pydantic:p python-numpy:p python-matplotlib:p

      - name: Record toolchain and runtime package versions
        run: |
          gcc --version | head -1
          cmake --version | head -1
          pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-libs mingw-w64-ucrt-x86_64-crt-git \
            mingw-w64-ucrt-x86_64-libwinpthread mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-expat \
            mingw-w64-ucrt-x86_64-qhull mingw-w64-ucrt-x86_64-libjpeg-turbo mingw-w64-ucrt-x86_64-gsl \
            | tee msys2-packages.txt
          echo "busybox-w32 $BUSYBOX_URL sha256 $BUSYBOX_SHA256" | tee -a msys2-packages.txt

      - name: Fetch busybox-w32 (pinned by sha256)
        run: |
          curl -fsSL -o busybox64u.exe "$BUSYBOX_URL" || curl -fsSL -o busybox64u.exe "$BUSYBOX_FALLBACK_URL"
          echo "$BUSYBOX_SHA256  busybox64u.exe" | sha256sum -c -

      - name: Compat layer unit tests
        run: |
          cmake -S compat -B build-compat -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-mingw.cmake" -DCMAKE_BUILD_TYPE=Release \
            -DAFNI_COMPAT_BUSYBOX="$PWD/busybox64u.exe"
          cmake --build build-compat
          ctest --test-dir build-compat --output-on-failure

      # X11/Motif/OpenGL headers (Ubuntu packages, sha512-pinned) for the
      # X-free builds of 3dSkullStrip and 1dplot (cmake/afni-nox.cmake, D35).
      - name: Fetch X11 headers
        run: python -m tools.x_headers --output-dir x-headers

      # CRAN R for Windows and the CRAN packages of the AFNI R programs, pinned
      # in manifests/r-runtime.txt (D39). Installed before the build: R_io.so
      # is built against its headers and R.dll.
      - name: Install R
        run: |
          echo "AFNI_R_HOME=$(cygpath -m "$RUNNER_TEMP")/R" >> "$GITHUB_ENV"
          python -m tools.r_runtime --r-home "$(cygpath -m "$RUNNER_TEMP")/R" --download-dir r-download

      - name: Build AFNI (required programs must build, optional ones are best effort)
        run: |
          python -m tools.build --tag "$AFNI_TAG" --upstream-url "$AFNI_UPSTREAM" \
            --work-dir build-win --optional-manifest manifests/programs-optional.txt \
            --optional-manifest manifests/models-optional.txt --target R_io \
            --cmake-define AFNI_WIN_PTAYLOR=ON --cmake-define AFNI_WIN_NOX=ON \
            --cmake-define "AFNI_WIN_X_HEADERS=$(cygpath -m "$PWD/x-headers")" \
            --cmake-define "AFNI_WIN_R_HOME=$AFNI_R_HOME"

      - name: Package
        run: |
          python -m tools.package --build-dir build-win --source-dir build-win/upstream \
            --runtime-dir "$(cygpath -w /ucrt64/bin)" --busybox busybox64u.exe --output-dir dist \
            --msys-root "$(cygpath -m /)" --r-home "$AFNI_R_HOME"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          $version = $env:AFNI_TAG -replace '^AFNI_', ''
          $numeric = (($version.Split('.') | ForEach-Object { [int]$_ }) + 0) -join '.'
          & $iscc /Q "/DAppVersion=$version" "/DNumericVersion=$numeric" `
            "/DSourceDir=$PWD\dist\afni-$env:AFNI_TAG-win64" "/DOutputDir=$PWD\dist" `
            "/DOutputName=afni-$env:AFNI_TAG-win64-setup" installer\afni-win.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      # Silent per-user installation with the PATH task, a program run with
      # PATH taken from the registry only, then a silent uninstallation.
      - name: Test the installer
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\afni-install"
          $setup = "dist\afni-$env:AFNI_TAG-win64-setup.exe"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', `
            '/CURRENTUSER', "/DIR=$dir", '/TASKS=addtopath', "/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; throw "setup exited with $($p.ExitCode)" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { throw "install directory not on the user PATH: $userPath" }
          $work = New-Item -ItemType Directory "$env:RUNNER_TEMP\installer-check"
          Push-Location $work
          $env:Path = "$userPath;$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:HOME, Env:TMPDIR -ErrorAction SilentlyContinue
          3dcalc -a 'jRandomDataset:8,8,8,2' -expr 'a*10' -prefix check
          if ($LASTEXITCODE -ne 0) { throw "3dcalc failed" }
          $env:AFNI_COMPRESSOR = 'GZIP'
          3dcalc -a 'check+orig' -expr 'a+1' -prefix check_gz
          if (-not (Test-Path 'check_gz+orig.BRIK.gz')) { throw "gzip output missing" }
          3dinfo -n4 'check_gz+orig'
          if ($LASTEXITCODE -ne 0) { throw "3dinfo failed" }
          Pop-Location
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\3dcalc.exe"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$dir\3dcalc.exe") { throw "uninstall left the programs" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $dir) { throw "uninstall left the PATH entry" }

      - uses: actions/download-artifact@v4
        with:
          name: regression-data
          path: regression/data

      # Runs the programs from the package with PATH limited to the package and
      # the Windows system directories, so a missing DLL or helper fails here.
      - name: Run the regression scenario from the package
        run: |
          python -m tests.regression.scenario run --isolated-path \
            --bin-dir "dist/afni-$AFNI_TAG-win64" --data-dir regression/data --out-dir regression/windows

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-windows
          path: regression/windows

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/package.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-windows-logs
          path: |
            build-win/build-result.json
            build-win/build/build.log
            build-win/build/CMakeCache.txt
            msys2-packages.txt

  # Acceptance pipeline from the installed package (tests/pipeline, D40):
  # the data and work directories are under a Cyrillic folder name;
  # afni_proc.py starts from cmd.exe through its launcher, the proc scripts
  # through tcsh.cmd, the group analysis inside the AFNI shell.
  pipeline-windows:
    needs: [linux-reference, windows]
    if: >-
      ${{ !cancelled() && (needs.windows.result == 'success'
      || (inputs.package_run && inputs.reference_run && needs.windows.result == 'skipped')) }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      AFNI_TAG: ${{ needs.linux-reference.outputs.tag }}
      OMP_NUM_THREADS: '1'
      AFNI_RANDOM_SEEDVAL: '31416'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
          run-id: ${{ inputs.package_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install the package
        run: |
          $dir = "$env:RUNNER_TEMP\AFNI"
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', `
            '/CURRENTUSER', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; throw "setup exited with $($p.ExitCode)" }
          "AFNI_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PIPELINE_DIR=$env:RUNNER_TEMP\данные" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: astral-sh/setup-uv@v6

      - name: Fetch the data
        run: uv run --frozen python -m tests.pipeline.data --data-dir "$env:PIPELINE_DIR\data"

      - name: Run the subjects and the group analysis
        run: |
          $common = @('--platform', 'windows', '--afni-dir', $env:AFNI_DIR, '--data-dir', "$env:PIPELINE_DIR\data",
            '--work-dir', "$env:PIPELINE_DIR\work", '--results-dir', 'results')
          foreach ($action in 'prepare', 'check', 'subjects', 'group') {
            uv run --frozen python -m tests.pipeline.run $action @common
            if ($LASTEXITCODE -ne 0) { throw "$action failed" }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-windows
          path: results

  compare:
    needs: [linux-reference, windows, pipeline-linux, pipeline-windows]
    if: >-
      ${{ !cancelled() && needs.pipeline-windows.result == 'success'
      && (needs.windows.result == 'success' || (inputs.package_run && needs.windows.result == 'skipped'))
      && (needs.pipeline-linux.result == 'success' || (inputs.reference_run && needs.pipeline-linux.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      AFNI_TAG: ${{ needs.linux-reference.outputs.tag || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: regression-linux
          path: regression/linux
          run-id: ${{ inputs.package_run || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: regression-windows
          path: regression/windows
          run-id: ${{ inputs.package_run || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: posix-callsites
          path: posix
          run-id: ${{ inputs.package_run || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: pipeline-linux
          path: pipeline/linux
          run-id: ${{ inputs.reference_run || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: pipeline-windows
          path: pipeline/windows

      - uses: astral-sh/setup-uv@v6

      - name: Report POSIX API changes since the previous release
        run: |
          AFNI_TAG=${AFNI_TAG:-$(cat manifests/upstream-baseline.txt)}
          gh release list --limit 1000 --json tagName > releases.json
          previous=$(uv run --frozen python -m tools.upstream_tags previous --tag "$AFNI_TAG" --released releases.json)
          if [ -n "$previous" ]; then
            gh release download "$previous-win" --pattern posix-callsites.json --dir posix-previous || true
          fi
          uv run --frozen python -m tools.posix_diff diff --previous posix-previous/posix-callsites.json \
            --current posix/posix-callsites.json --report posix-diff.md
          cat posix-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compare Linux and Windows outputs
        run: |
          set +e
          uv run --frozen python -m tests.regression.compare \
            --reference regression/linux --candidate regression/windows \
            --report comparison.md --json-report comparison.json
          status=$?
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Acceptance criteria of D40: every output of every subject and of the
      # group analysis within tests/pipeline/tolerance.json, and the wall
      # time of the subjects at most 1.5 times the Linux time.
      - name: Compare the pipeline outputs and times
        run: |
          status=0
          : > pipeline-comparison.md
          for ref in pipeline/linux/results/outputs/*/; do
            name=$(basename "$ref")
            uv run --frozen python -m tests.regression.compare --reference "$ref" \
              --candidate "pipeline/windows/outputs/$name" --tolerance tests/pipeline/tolerance.json \
              --report "pipeline-$name.md" || status=1
            { echo "### Pipeline: $name"; tail -n +2 "pipeline-$name.md"; } >> pipeline-comparison.md
          done
          uv run --frozen python -m tests.pipeline.run time --reference pipeline/linux/results/timing.json \
            --candidate pipeline/windows/timing.json --limit 1.5 --report pipeline-time.md || status=1
          cat pipeline-time.md pipeline-comparison.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            comparison.md
            comparison.json
            posix-diff.md
            pipeline-time.md
            pipeline-comparison.md

  release:
    needs: [linux-reference, windows, compare]
    if: ${{ inputs.publish && !inputs.reference_run && !inputs.package_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      AFNI_TAG: ${{ needs.linux-reference.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: astral-sh/setup-uv@v6

      - name: Publish the release
        run: |
          if gh release view "$AFNI_TAG-win" > /dev/null 2>&1; then
            echo "Release $AFNI_TAG-win already exists; nothing to do."
            exit 0
          fi
          uv run --frozen python -m tools.release_notes \
            --build-result artifacts/build-windows-logs/build-win/build-result.json \
            --package artifacts/package/package.json \
            --comparison artifacts/comparison/comparison.md \
            --posix-diff artifacts/comparison/posix-diff.md \
            --packages artifacts/build-windows-logs/msys2-packages.txt \
            --installer "artifacts/package/afni-$AFNI_TAG-win64-setup.exe" \
            --commit "$GITHUB_SHA" --output notes.md
          gh release create "$AFNI_TAG-win" --target "$GITHUB_SHA" \
            --title "AFNI $AFNI_TAG for Windows" --notes-file notes.md \
            artifacts/package/*-setup.exe artifacts/package/*.zip artifacts/package/package.json \
            artifacts/comparison/comparison.md artifacts/posix-callsites/posix-callsites.json \
            artifacts/build-windows-logs/build-win/build-result.json

      - name: Close the failure issue of this tag
        run: |
          gh issue list --label build-failed --state open --search "\"Build failed: $AFNI_TAG\" in:title" \
            --json number --jq '.[].number' | while read -r n; do
            gh issue close "$n" --comment "Built and released by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

  record-failure:
    needs: [linux-reference, windows, compare]
    if: ${{ failure() && inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      AFNI_TAG: ${{ needs.linux-reference.outputs.tag || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark the tag as failed
        run: |
          AFNI_TAG=${AFNI_TAG:-$(cat manifests/upstream-baseline.txt)}
          title="Build failed: $AFNI_TAG"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label build-failed --state all \
            --search "\"$title\" in:title" --json title --jq ".[] | select(.title == \"$title\") | .title")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            echo "Issue for $AFNI_TAG already exists."
            exit 0
          fi
          gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Upstream tag that failed to build" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --label build-failed --title "$title" \
            --body "The publishing build of $AFNI_TAG failed: $run_url

          watch-upstream-tags.yml does not start this tag again while this issue exists (open or closed).
          After a fix, start build-windows.yml manually with tag=$AFNI_TAG and publish=true."
