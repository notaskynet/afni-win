name: r-probe

# One-off: find the current CRAN R for Windows installer and its sha256, and
# the Posit Package Manager snapshot URL, to pin them in manifests/r-runtime.txt.
on:
  push:
    branches: [claude/scripts-research]
    paths:
      - .github/workflows/r-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -fsSL https://cloud.r-project.org/bin/windows/base/ | grep -o 'R-[0-9.]*-win.exe' | sort -u
          f=$(curl -fsSL https://cloud.r-project.org/bin/windows/base/ | grep -o 'R-[0-9.]*-win.exe' | sort -u | tail -1)
          curl -fsSL -o "$f" "https://cloud.r-project.org/bin/windows/base/$f"
          ls -la "$f"; sha256sum "$f"
          curl -fsSL https://cloud.r-project.org/bin/windows/base/old/ | grep -o 'href="[0-9.]*/"' | tail -3
          curl -s -o /dev/null -w "p3m snapshot %{http_code}\n" "https://packagemanager.posit.co/cran/2026-10-01/src/contrib/PACKAGES"
          v=$(echo "$f" | sed 's/R-\([0-9]*\.[0-9]*\).*/\1/')
          curl -s -o /dev/null -w "p3m windows bin %{http_code}\n" "https://packagemanager.posit.co/cran/2026-10-01/bin/windows/contrib/$v/PACKAGES"
          curl -fsSL "https://packagemanager.posit.co/cran/2026-10-01/bin/windows/contrib/$v/PACKAGES" | grep -A1 "^Package: \(afex\|lme4\|glmmTMB\|phia\)$" | head -8
