name: scripts-recompare

# Compares the results of an earlier scripts-prototype run again (no
# rebuild): Linux vs each Windows variant, with the pipeline tolerance of
# tests/scripts/tolerance.json (every output is downstream of the EPI/anatomy
# registration, D29 class "iterative optimisation"). Research only.

on:
  push:
    branches: [claude/scripts-research]
    paths:
      - tests/scripts/tolerance.json
      - .github/workflows/scripts-recompare.yml

permissions:
  contents: read
  actions: read

env:
  PROTOTYPE_RUN_ID: '37796401113'

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: prototype-*
          run-id: ${{ env.PROTOTYPE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Compare with the pipeline tolerance
        run: |
          mkdir -p prototype-linux/outputs/logs
          for v in posix-shell posix-shell-defender; do
            mkdir -p "prototype-windows-$v/outputs/logs"
            uv run --frozen python -m tests.regression.compare --reference prototype-linux/outputs \
              --candidate "prototype-windows-$v/outputs" --tolerance tests/scripts/tolerance.json \
              --report "comparison-$v.md" || true
            { echo "### Variant $v"; cat "comparison-$v.md"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
